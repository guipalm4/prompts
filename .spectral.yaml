# .spectral.yaml - Configuração "Agentic Strict Mode"
extends: ["spectral:oas", "spectral:asyncapi"]

rules:
  # 
  # BLOCO 1: CONTEXTO SEMÂNTICO (Combustível para Agentes)
  # 
  
  # Regra 1.A: Descrições são obrigatórias em TUDO.
  # Sem descrição = O Agente Dev não sabe o que implementar.
  description-is-mandatory:
    description: "Para garantir autonomia da IA, todos os campos devem ter descrição."
    message: "{{property}} deve ter uma descrição."
    severity: error
    given:
      - $.paths.*.*                 # Operações (GET, POST...)
      - $.paths.*.*.parameters.*    # Parâmetros de URL/Query
      - $.components.schemas.*      # Objetos de Domínio
      - $.components.schemas.*.properties.* # Campos dos Objetos
    then:
      field: description
      function: truthy

  # Regra 1.2: OperationID é vital para gerar SDKs e nomes de funções.
  operation-operationId:
    description: "Toda rota precisa de um ID único para gerar nomes de métodos no código."
    severity: error
    given: $.paths.*[get,post,put,delete,patch,options,head,trace]
    then:
      field: operationId
      function: truthy

  # 
  # BLOCO 2: PADRÕES DE NOMENCLATURA (Consistência Código/JSON)
  # 

  # Regra 2.3: Propriedades JSON em camelCase (Padrão Web/React)
  # Ex: { "userName": "Gui" } é válido. { "user_name": "Gui" } é erro.
  model-properties-camelCase:
    description: "Propriedades dos objetos JSON devem seguir o padrão camelCase."
    severity: error
    given: $.components.schemas.*.properties
    then:
      field: "@key"
      function: casing
      functionOptions:
        type: camel

  # Regra 2.4: URLs em kebab-case (Padrão RESTful)
  # Ex: /reset-password é válido. /reset_password é erro.
  paths-kebab-case:
    description: "Segmentos da URL devem usar kebab-case (ex: /users/my-items)."
    severity: error
    given: $.paths[*]
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(\/|[a-z0-9-.]+|{[a-zA-Z0-9_]+})+$"

  # 
  # BLOCO 3: AUTONOMIA DE TESTES (Mock Server & QA)
  # 

  # Regra 3: Exemplos são obrigatórios.
  # Sem exemplo = Mock Server retorna lixo e QA Agent não tem base de comparação.
  examples-are-mandatory:
    description: "Respostas devem ter exemplos para alimentar o Mock Server e testes."
    message: "A resposta {{error.path}} precisa de um campo 'example' ou 'examples'."
    severity: error
    given: $.paths.*.*.responses[?(@property >= 200 && @property &lt; 300)].content.*
    then:
      function: xor
      functionOptions:
        properties: 
          - example
          - examples

  # 
  # REGRAS EXTRAS DE SEGURANÇA & BOAS PRÁTICAS
  # 
  
  # Evita expor stack traces ou erros genéricos 500 sem schema
  no-error-structure-missing:
    description: "Respostas de erro (4xx, 5xx) devem ter estrutura definida."
    severity: error
    given: $.paths.*.*.responses[?(@property >= 400)]
    then:
      field: content
      function: truthy

  # Garante que tags sejam usadas para agrupar rotas (Controllers)
  operation-tags:
    description: "Operações devem ter tags para agrupar controllers no código gerado."
    severity: error
    given: $.paths.*[get,post,put,delete,patch]
    then:
      field: tags
      function: truthy